services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: teddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdevonly}
      POSTGRES_DB: teddy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teddy -d teddy"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://teddy:${POSTGRES_PASSWORD:-localdevonly}@db:5432/teddy
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
  web:
    build:
      context: ./frontend
      args:
        VITE_WHATSAPP_NUMBER: ${VITE_WHATSAPP_NUMBER:-971500000000}
    depends_on:
      - api
    ports:
      - "5173:80"
volumes:
  pgdata:
